org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true

android.useAndroidX=true
android.enableJetifier=true
kotlin.code.style=official

# Built-in Kotlin (AGP 9+)
android.newDsl=false
android.builtInKotlin=true

# R8 full mode — better shrinking/obfuscation for release
android.enableR8.fullMode=true

# Non-transitive R classes — faster builds, smaller intermediate artifacts
android.nonTransitiveRClass=true

# Prefer compressed native libs in APK (smaller download size)
android.bundle.enableUncompressedNativeLibs=false
