name: mport_test_speed
description: MPorT Go - Accurate internet speed test application.
publish_to: 'none'
version: 1.9.26+46

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.5.0
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4
  web_socket_channel: ^3.0.2
  connectivity_plus: ^6.1.0
  webview_flutter: ^4.10.0
  intl: ^0.19.0
  video_player: ^2.9.2
  device_info_plus: ^13.2.0
  network_info_plus: ^8.2.1
  permission_handler: ^11.4.0
  flutter_local_notifications: ^18.0.1
  share_plus: ^13.3.0
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/mport_logo.png
    - assets/images/mport_logo_noborder.png
    - assets/videos/mport_splash.mp4
