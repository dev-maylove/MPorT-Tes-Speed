publish_to: 'none'
version: 1.9.2+21

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.5.0
  shared_preferences: ^2.5.3
  web_socket_channel: ^3.0.2
  connectivity_plus: ^6.1.0
