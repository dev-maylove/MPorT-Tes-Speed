# Flutter / Dart analysis & lint configuration — MPorT Go
# Docs: https://dart.dev/tools/analysis
# Rules: https://dart.dev/tools/linter-rules
#
# Base set comes from flutter_lints (recommended for Flutter apps).
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - .dart_tool/**
    - .pub-cache/**
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/*.mocks.dart"
    - "**/*.config.dart"
    - "**/generated_plugin_registrant.dart"
    - MPorT-GO-signed-release/**
    - android/**
    - ios/**
    - linux/**
    - macos/**
    - web/**
    - windows/**

  errors:
    # Surface unused code as warnings (not silent infos)
    unused_element: warning
    unused_import: warning
    unused_local_variable: warning
    dead_code: warning
    # Do not fail analyze on TODO comments
    todo: ignore
    # Common false-positives / noise
    invalid_annotation_target: ignore

  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    # ── Const & performance ──────────────────────────────────
    prefer_const_constructors: true
    prefer_const_constructors_in_immutables: true
    prefer_const_declarations: true
    prefer_const_literals_to_create_immutables: true
    unnecessary_const: true
    unnecessary_new: true

    # ── Style / readability ──────────────────────────────────
    prefer_final_fields: true
    prefer_final_locals: true
    prefer_final_in_for_each: true
    unnecessary_this: true
    unnecessary_late: true
    unnecessary_string_interpolations: true
    unnecessary_string_escapes: true
    prefer_is_empty: true
    prefer_is_not_empty: true
    prefer_single_quotes: true
    directives_ordering: true
    sort_child_properties_last: true
    use_key_in_widget_constructors: true
    sized_box_for_whitespace: true
    use_full_hex_values_for_flutter_colors: true

    # ── Safety ───────────────────────────────────────────────
    avoid_relative_lib_imports: true
    avoid_types_as_parameter_names: true
    no_duplicate_case_values: true
    empty_catches: false          # project uses empty catch for network soft-fail
    avoid_empty_else: true
    valid_regexps: true
    hash_and_equals: true

    # ── Explicitly disabled (noise or team preference) ───────
    avoid_print: false            # allow debug prints during development
    public_member_api_docs: false # app code, not a published package
    lines_longer_than_80_chars: false
    always_specify_types: false   # rely on type inference
    always_use_package_imports: false
    avoid_classes_with_only_static_members: false
    constant_identifier_names: false  # allow UPPER_SNAKE for const ids if needed
