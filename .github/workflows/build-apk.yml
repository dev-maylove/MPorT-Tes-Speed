name: Build MPorT Tes Speed APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Flutter Analyze Test Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Complete Android platform if needed
        run: |
          # Generates missing gradle wrapper etc. without deleting existing sources
          flutter create . --project-name mport_test_speed --org id.haansiro --platforms=android

      - name: Force-safe styles (prevent Theme.Light.NoActionBar)
        run: |
          mkdir -p android/app/src/main/res/values android/app/src/main/res/values-night android/app/src/main/res/drawable
          printf '%s\n' \
            '<?xml version="1.0" encoding="utf-8"?>' \
            '<resources>' \
            '    <style name="LaunchTheme" parent="@android:style/Theme.Black.NoTitleBar">' \
            '        <item name="android:windowBackground">@drawable/launch_background</item>' \
            '        <item name="android:statusBarColor">@android:color/transparent</item>' \
            '        <item name="android:navigationBarColor">#080808</item>' \
            '        <item name="android:windowLightStatusBar">false</item>' \
            '    </style>' \
            '    <style name="NormalTheme" parent="@android:style/Theme.Black.NoTitleBar">' \
            '        <item name="android:windowBackground">#080808</item>' \
            '        <item name="android:statusBarColor">@android:color/transparent</item>' \
            '        <item name="android:navigationBarColor">#080808</item>' \
            '        <item name="android:windowLightStatusBar">false</item>' \
            '    </style>' \
            '</resources>' \
            > android/app/src/main/res/values/styles.xml
          cp android/app/src/main/res/values/styles.xml android/app/src/main/res/values-night/styles.xml
          printf '%s\n' \
            '<?xml version="1.0" encoding="utf-8"?>' \
            '<layer-list xmlns:android="http://schemas.android.com/apk/res/android">' \
            '    <item android:drawable="@android:color/black"/>' \
            '</layer-list>' \
            > android/app/src/main/res/drawable/launch_background.xml
          # Ensure no forbidden theme remains
          if grep -R "Theme.Light.NoActionBar" android/; then
            echo "Forbidden theme still present" && exit 1
          fi
          echo "Styles OK"

      - name: Fix default widget_test from flutter create
        run: |
          printf '%s
' \
            "import 'package:flutter_test/flutter_test.dart';" \
            "import 'package:mport_test_speed/main.dart';" \
            "" \
            "void main() {" \
            "  testWidgets('MporTApp loads smoke test', (WidgetTester tester) async {" \
            "    await tester.pumpWidget(const MporTApp());" \
            "    await tester.pump();" \
            "    expect(find.textContaining('MPorT'), findsWidgets);" \
            "  });" \
            "}" \
            > test/widget_test.dart


      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Build APK (release)
        run: flutter build apk --release --no-tree-shake-icons

      - name: List APK outputs
        if: always()
        run: |
          find build -name "*.apk" -type f 2>/dev/null || true
          ls -la build/app/outputs/flutter-apk/ 2>/dev/null || true
          ls -la build/app/outputs/apk/release/ 2>/dev/null || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MPorT-Tes-Speed-release
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
