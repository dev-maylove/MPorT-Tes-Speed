name: Build MPorT Tes Speed APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Flutter Analyze Test Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Complete Android platform if needed
        run: flutter create . --project-name mport_test_speed --org id.haansiro --platforms=android

      - name: Pin Gradle 9.3.1 + AGP 9.1.0 + Kotlin 2.4.0
        run: |
          set -e

          mkdir -p android/gradle/wrapper
          cat > android/gradle/wrapper/gradle-wrapper.properties << 'PROPS'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-9.3.1-all.zip
          PROPS
          sed -i 's/^          //' android/gradle/wrapper/gradle-wrapper.properties

          # settings.gradle.kts → AGP 9.1.0 + Kotlin 2.4.0
          if [ -f android/settings.gradle.kts ]; then
            sed -i 's/id("com.android.application") version "[^"]*"/id("com.android.application") version "9.1.0"/' android/settings.gradle.kts
            if grep -q 'org.jetbrains.kotlin.android' android/settings.gradle.kts; then
              sed -i 's/id("org.jetbrains.kotlin.android") version "[^"]*"/id("org.jetbrains.kotlin.android") version "2.4.0"/' android/settings.gradle.kts
            else
              sed -i '/id("com.android.application")/a\    id("org.jetbrains.kotlin.android") version "2.4.0" apply false' android/settings.gradle.kts
            fi
          fi
          if [ -f android/settings.gradle ]; then
            sed -i "s/id \"com.android.application\" version \"[^\"]*\"/id \"com.android.application\" version \"9.1.0\"/" android/settings.gradle
            if grep -q 'org.jetbrains.kotlin.android' android/settings.gradle; then
              sed -i "s/id \"org.jetbrains.kotlin.android\" version \"[^\"]*\"/id \"org.jetbrains.kotlin.android\" version \"2.4.0\"/" android/settings.gradle
            else
              sed -i '/id "com.android.application"/a\    id "org.jetbrains.kotlin.android" version "2.4.0" apply false' android/settings.gradle
            fi
          fi

          # gradle.properties — wajib untuk Flutter + AGP 9
          cat > android/gradle.properties << 'PROPS'
          org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:+HeapDumpOnOutOfMemoryError
          android.useAndroidX=true
          android.enableJetifier=true
          kotlin.code.style=official
          android.newDsl=false
          android.builtInKotlin=false
          PROPS
          sed -i 's/^          //' android/gradle.properties

          # app/build.gradle.kts — pastikan plugin Kotlin ada, hapus kotlinOptions lama
          if [ -f android/app/build.gradle.kts ]; then
            # Pastikan plugin kotlin ada
            if ! grep -q 'org.jetbrains.kotlin.android\|kotlin-android' android/app/build.gradle.kts; then
              sed -i '/id("com.android.application")/a\    id("org.jetbrains.kotlin.android")' android/app/build.gradle.kts
            fi
            # Normalisasi id plugin
            sed -i 's/id("kotlin-android")/id("org.jetbrains.kotlin.android")/' android/app/build.gradle.kts
            # Hapus kotlinOptions deprecated (bisa bikin error di AGP 9)
            sed -i '/kotlinOptions/,/}/d' android/app/build.gradle.kts
            # Pastikan compileOptions Java 17
            if ! grep -q 'sourceCompatibility' android/app/build.gradle.kts; then
              sed -i '/android {/a\    compileOptions {\n        sourceCompatibility = JavaVersion.VERSION_17\n        targetCompatibility = JavaVersion.VERSION_17\n    }' android/app/build.gradle.kts
            fi
          fi

          echo "===== Gradle wrapper ====="
          cat android/gradle/wrapper/gradle-wrapper.properties
          echo "===== settings ====="
          cat android/settings.gradle.kts 2>/dev/null || true
          echo "===== gradle.properties ====="
          cat android/gradle.properties
          echo "===== app/build.gradle.kts head ====="
          head -50 android/app/build.gradle.kts

      - name: Force-safe Android styles
        run: |
          mkdir -p android/app/src/main/res/values
          mkdir -p android/app/src/main/res/values-night
          mkdir -p android/app/src/main/res/drawable

          cat > android/app/src/main/res/values/styles.xml << 'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="LaunchTheme" parent="@android:style/Theme.Black.NoTitleBar">
                  <item name="android:windowBackground">@drawable/launch_background</item>
                  <item name="android:statusBarColor">@android:color/transparent</item>
                  <item name="android:navigationBarColor">#080808</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>
              <style name="NormalTheme" parent="@android:style/Theme.Black.NoTitleBar">
                  <item name="android:windowBackground">#080808</item>
                  <item name="android:statusBarColor">@android:color/transparent</item>
                  <item name="android:navigationBarColor">#080808</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>
          </resources>
          XML
          sed -i 's/^          //' android/app/src/main/res/values/styles.xml
          cp android/app/src/main/res/values/styles.xml android/app/src/main/res/values-night/styles.xml

          cat > android/app/src/main/res/drawable/launch_background.xml << 'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:drawable="@android:color/black"/>
          </layer-list>
          XML
          sed -i 's/^          //' android/app/src/main/res/drawable/launch_background.xml
          echo "Styles OK"

      - name: Fix default widget_test
        run: |
          cat > test/widget_test.dart << 'DART'
          import 'package:flutter_test/flutter_test.dart';
          import 'package:mport_test_speed/main.dart';

          void main() {
            testWidgets('MporTApp loads smoke test', (WidgetTester tester) async {
              await tester.pumpWidget(const MporTApp());
              await tester.pump();
              expect(find.textContaining('MPorT'), findsWidgets);
            });
          }
          DART
          sed -i 's/^          //' test/widget_test.dart

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Build APK (release)
        run: flutter build apk --release --no-tree-shake-icons

      - name: List APK outputs
        if: always()
        run: |
          find . -name "*.apk" -type f 2>/dev/null || true
          ls -la build/app/outputs/flutter-apk/ 2>/dev/null || true
          ls -la build/app/outputs/apk/release/ 2>/dev/null || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MPorT-Tes-Speed-release
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
