# MPorT Tes Speed — Build Release APK
# Trigger: push/PR ke main|master, atau manual (workflow_dispatch)

name: Build MPorT Tes Speed APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Flutter Analyze · Test · Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Accept Android licenses
        run: |
          yes | flutter doctor --android-licenses || true
          flutter doctor -v

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      # ── Signing ────────────────────────────────────────────────────
      # Prioritas:
      # 1. GitHub Secrets (KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_PASSWORD, KEY_ALIAS)
      # 2. File keystore + key.properties yang sudah ada di repo
      - name: Setup release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "→ Menggunakan keystore dari GitHub Secrets"
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/mport-release-key.jks
            cat > android/key.properties << EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=mport-release-key.jks
          EOF
          else
            echo "→ Secrets kosong — cek keystore di repo"
          fi

          if [ -f android/key.properties ] && [ -f android/app/mport-release-key.jks ]; then
            echo "✓ Keystore & key.properties siap — APK akan di-sign release"
          else
            echo "⚠ Keystore tidak lengkap — build release akan pakai debug signing"
          fi

      - name: Build APK (release)
        run: flutter build apk --release

      - name: List output
        run: |
          ls -lah build/app/outputs/flutter-apk/
          echo "---"
          shasum -a 256 build/app/outputs/flutter-apk/*.apk || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MPorT-Tes-Speed-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

  # Optional: build App Bundle (AAB) untuk Play Store
  build-aab:
    name: Build App Bundle (AAB)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Hanya jalan saat manual atau tag release (hemat menit CI)
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Pub get
        run: flutter pub get

      - name: Setup release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "→ Menggunakan keystore dari GitHub Secrets"
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/mport-release-key.jks
            cat > android/key.properties << EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=mport-release-key.jks
          EOF
          else
            echo "→ Secrets kosong — cek keystore di repo"
          fi

          if [ -f android/key.properties ] && [ -f android/app/mport-release-key.jks ]; then
            echo "✓ Keystore & key.properties siap — AAB akan di-sign release"
          else
            echo "⚠ Keystore tidak lengkap — build release akan pakai debug signing"
          fi

      - name: Build App Bundle
        run: flutter build appbundle --release

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: MPorT-Tes-Speed-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
