name: Build MPorT Tes Speed APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Flutter Analyze · Test · Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Setup release signing
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/mport-release-key.jks
            cat > android/key.properties <<EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=mport-release-key.jks
          EOF
            echo "Signing via GitHub Secrets"
          elif [ -f android/key.properties ] && [ -f android/app/mport-release-key.jks ]; then
            echo "Signing via keystore in repo"
          else
            echo "No keystore — release will use debug signing"
          fi

      - name: Build APK (release, split per ABI)
        run: |
          # Split per ABI = APK jauh lebih kecil per arsitektur
          # --obfuscate + --split-debug-info untuk shrink lebih lanjut
          flutter build apk --release --split-per-abi \
            --obfuscate \
            --split-debug-info=build/debug-info

      - name: Locate APKs
        run: |
          mkdir -p artifacts
          # Prefer split APKs (armeabi-v7a, arm64-v8a, x86_64)
          found=0
          for apk in build/app/outputs/flutter-apk/*.apk; do
            if [ -f "$apk" ]; then
              cp "$apk" "artifacts/$(basename "$apk")"
              found=1
            fi
          done
          if [ "$found" -eq 0 ]; then
            APK=$(find build -name "*.apk" -type f 2>/dev/null | head -1)
            if [ -n "$APK" ]; then
              cp "$APK" artifacts/app-release.apk
            else
              echo "APK not found"
              find build -type f -name "*.apk" || true
              exit 1
            fi
          fi
          echo "=== APK artifacts ==="
          ls -lh artifacts/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MPorT-Tes-Speed-release
          path: artifacts/
          if-no-files-found: error
