      # ============================================================
      # VERIFY APK SIGNATURE
      # ============================================================
      - name: Verify APK signatures
        env:
          EXPECTED_SHA256: "B8:2C:BB:24:66:9B:42:38:BE:72:D7:0C:18:DF:20:E9:72:01:FB:95:27:98:1D:3A:1D:1A:0D:E7:01:AC:39:40"
        run: |
          set -euo pipefail

          BUILD_TOOLS="$(
            find "${ANDROID_HOME}/build-tools" \
              -maxdepth 1 \
              -mindepth 1 \
              -type d |
            sort -V |
            tail -n 1
          )"

          APKSIGNER="${BUILD_TOOLS}/apksigner"

          if [ ! -x "${APKSIGNER}" ]; then
            echo "::error::apksigner not found"
            exit 1
          fi

          echo "Using apksigner: ${APKSIGNER}"

          mkdir -p verified-apks

          found=0

          for apk in build/app/outputs/flutter-apk/*.apk; do
            [ -f "${apk}" ] || continue

            found=1

            echo ""
            echo "================================================"
            echo "VERIFYING: ${apk}"
            echo "================================================"

            # Run Android APK signature verification.
            "${APKSIGNER}" verify \
              --verbose \
              --print-certs \
              "${apk}"

            # Capture the complete certificate output.
            CERT_OUTPUT="$(
              "${APKSIGNER}" verify \
                --print-certs \
                "${apk}" 2>&1
            )"

            echo "Extracting certificate SHA-256..."

            # Extract a complete SHA-256 fingerprint regardless
            # of the exact apksigner output wording.
            CERT_SHA256="$(
              printf '%s\n' "${CERT_OUTPUT}" |
              grep -Eo '([0-9A-Fa-f]{2}:){31}[0-9A-Fa-f]{2}' |
              head -n 1 |
              tr '[:lower:]' '[:upper:]'
            )"

            echo "APK certificate SHA-256:"
            echo "${CERT_SHA256}"

            if [ -z "${CERT_SHA256}" ]; then
              echo "::error::Could not extract APK certificate SHA-256."
              echo "::error::Complete apksigner output:"
              printf '%s\n' "${CERT_OUTPUT}"
              exit 1
            fi

            if [ "${CERT_SHA256}" != "${EXPECTED_SHA256}" ]; then
              echo "::error::APK is NOT signed with the NEW keystore."
              echo "::error::Expected: ${EXPECTED_SHA256}"
              echo "::error::Actual:   ${CERT_SHA256}"
              exit 1
            fi

            echo "✓ APK signature matches NEW keystore."

            cp "${apk}" "verified-apks/$(basename "${apk}")"
          done

          if [ "${found}" -eq 0 ]; then
            echo "::error::No APK files found"
            exit 1
          fi

          echo ""
          echo "=========================================="
          echo "ALL APK SIGNATURES VERIFIED"
          echo "=========================================="

          ls -lh verified-apks/
