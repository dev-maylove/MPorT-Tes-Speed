name: Build MPorT Tes Speed APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Flutter Analyze Test Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Complete Android platform if needed
        run: flutter create . --project-name mport_test_speed --org id.haansiro --platforms=android

      - name: Pin Gradle 9.3.1 + AGP 9.1.0 + Kotlin 2.4.0 + fix DSL
        run: |
          set -e

          # ── 1. Gradle wrapper ──────────────────────────────────────────
          mkdir -p android/gradle/wrapper
          cat > android/gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-9.3.1-all.zip
          EOF
          sed -i 's/^          //' android/gradle/wrapper/gradle-wrapper.properties

          # ── 2. settings.gradle.kts → AGP 9.1.0 + Kotlin 2.4.0 ─────────
          if [ -f android/settings.gradle.kts ]; then
            sed -i 's/id("com.android.application") version "[^"]*"/id("com.android.application") version "9.1.0"/' android/settings.gradle.kts
            sed -i 's/id("org.jetbrains.kotlin.android") version "[^"]*"/id("org.jetbrains.kotlin.android") version "2.4.0"/' android/settings.gradle.kts
          fi
          if [ -f android/settings.gradle ]; then
            sed -i "s/id \"com.android.application\" version \"[^\"]*\"/id \"com.android.application\" version \"9.1.0\"/" android/settings.gradle
            sed -i "s/id \"org.jetbrains.kotlin.android\" version \"[^\"]*\"/id \"org.jetbrains.kotlin.android\" version \"2.4.0\"/" android/settings.gradle
          fi

          # ── 3. gradle.properties (overwrite, wajib untuk AGP 9) ────────
          cat > android/gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:+HeapDumpOnOutOfMemoryError
          android.useAndroidX=true
          android.enableJetifier=true
          kotlin.code.style=official
          android.newDsl=false
          android.builtInKotlin=false
          EOF
          sed -i 's/^          //' android/gradle.properties

          # ── 4. Fix app/build.gradle.kts (hapus kotlinOptions deprecated) ─
          #    Ganti kotlinOptions { jvmTarget = ... } → compilerOptions DSL
          if [ -f android/app/build.gradle.kts ]; then
            # Hapus blok kotlinOptions lama (multi-line)
            python3 - << 'PY'
          from pathlib import Path
          import re
          p = Path("android/app/build.gradle.kts")
          text = p.read_text()

          # Pastikan import JvmTarget ada
          if "import org.jetbrains.kotlin.gradle.dsl.JvmTarget" not in text:
              text = "import org.jetbrains.kotlin.gradle.dsl.JvmTarget\n" + text

          # Hapus blok kotlinOptions { ... }
          text = re.sub(
              r"\s*kotlinOptions\s*\{[^}]*\}",
              "",
              text,
              flags=re.DOTALL,
          )

          # Tambah blok kotlin { compilerOptions } jika belum ada
          if "compilerOptions" not in text:
              kotlin_block = """
          kotlin {
              compilerOptions {
                  jvmTarget.set(JvmTarget.JVM_17)
              }
          }
          """
              # Sisipkan sebelum flutter { atau di akhir file
              if "flutter {" in text:
                  text = text.replace("flutter {", kotlin_block + "\nflutter {")
              else:
                  text = text.rstrip() + "\n" + kotlin_block

          p.write_text(text)
          print("app/build.gradle.kts patched OK")
          PY
          fi

          echo "===== Gradle wrapper ====="
          cat android/gradle/wrapper/gradle-wrapper.properties
          echo "===== settings (AGP/Kotlin) ====="
          grep -n "com.android.application\|kotlin.android" android/settings.gradle.kts android/settings.gradle 2>/dev/null || true
          echo "===== gradle.properties ====="
          cat android/gradle.properties
          echo "===== app/build.gradle.kts (kotlin section) ====="
          grep -n -A6 "kotlin\|compilerOptions\|jvmTarget\|kotlinOptions" android/app/build.gradle.kts 2>/dev/null || true

      - name: Force-safe Android styles
        run: |
          mkdir -p android/app/src/main/res/values
          mkdir -p android/app/src/main/res/values-night
          mkdir -p android/app/src/main/res/drawable
          cat > android/app/src/main/res/values/styles.xml << 'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="LaunchTheme" parent="@android:style/Theme.Black.NoTitleBar">
                  <item name="android:windowBackground">@drawable/launch_background</item>
                  <item name="android:statusBarColor">@android:color/transparent</item>
                  <item name="android:navigationBarColor">#080808</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>
              <style name="NormalTheme" parent="@android:style/Theme.Black.NoTitleBar">
                  <item name="android:windowBackground">#080808</item>
                  <item name="android:statusBarColor">@android:color/transparent</item>
                  <item name="android:navigationBarColor">#080808</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>
          </resources>
          XML
          sed -i 's/^          //' android/app/src/main/res/values/styles.xml
          cp android/app/src/main/res/values/styles.xml android/app/src/main/res/values-night/styles.xml
          cat > android/app/src/main/res/drawable/launch_background.xml << 'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:drawable="@android:color/black"/>
          </layer-list>
          XML
          sed -i 's/^          //' android/app/src/main/res/drawable/launch_background.xml
          if grep -R "Theme.Light.NoActionBar" android/; then
            echo "Forbidden theme still present"
            exit 1
          fi
          echo "Styles OK"

      - name: Fix default widget_test
        run: |
          cat > test/widget_test.dart << 'DART'
          import 'package:flutter_test/flutter_test.dart';
          import 'package:mport_test_speed/main.dart';

          void main() {
            testWidgets('MporTApp loads smoke test', (WidgetTester tester) async {
              await tester.pumpWidget(const MporTApp());
              await tester.pump();
              expect(find.textContaining('MPorT'), findsWidgets);
            });
          }
          DART
          sed -i 's/^          //' test/widget_test.dart

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Build APK (release)
        run: flutter build apk --release --no-tree-shake-icons

      - name: List APK outputs
        if: always()
        run: |
          find build -name "*.apk" -type f 2>/dev/null || true
          ls -la build/app/outputs/flutter-apk/ 2>/dev/null || true
          ls -la build/app/outputs/apk/release/ 2>/dev/null || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MPorT-Tes-Speed-release
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
