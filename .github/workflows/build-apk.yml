name: Build MPorT GO AAB

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Flutter Analyze Test Signed AAB
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      # ============================================================
      # SETUP UPLOAD KEY
      # ============================================================
      - name: Setup Google Play upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail

          echo "Checking signing secrets..."

          test -n "${KEYSTORE_BASE64}" || {
            echo "::error::KEYSTORE_BASE64 is missing"
            exit 1
          }

          test -n "${KEYSTORE_PASSWORD}" || {
            echo "::error::KEYSTORE_PASSWORD is missing"
            exit 1
          }

          test -n "${KEY_PASSWORD}" || {
            echo "::error::KEY_PASSWORD is missing"
            exit 1
          }

          test -n "${KEY_ALIAS}" || {
            echo "::error::KEY_ALIAS is missing"
            exit 1
          }

          mkdir -p android/app

          printf '%s' "${KEYSTORE_BASE64}" |
            base64 --decode > android/app/mport-release-new.jks

          test -s android/app/mport-release-new.jks

          chmod 600 android/app/mport-release-new.jks

          cat > android/key.properties <<EOF2
          storePassword=${KEYSTORE_PASSWORD}
          keyPassword=${KEY_PASSWORD}
          keyAlias=${KEY_ALIAS}
          storeFile=app/mport-release-new.jks
          EOF2

          chmod 600 android/key.properties

          echo "Upload keystore created."

      # ============================================================
      # VERIFY KEYSTORE
      # ============================================================
      - name: Verify upload keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail

          echo "Checking alias..."

          keytool -list \
            -keystore android/app/mport-release-new.jks \
            -alias "${KEY_ALIAS}" \
            -storepass "${KEYSTORE_PASSWORD}" \
            >/tmp/keystore-check.txt

          EXPECTED_SHA256="B8:2C:BB:24:66:9B:42:38:BE:72:D7:0C:18:DF:20:E9:72:01:FB:95:27:98:1D:3A:1D:1A:0D:E7:01:AC:39:40"

          ACTUAL_SHA256="$(
            keytool -list -v \
              -keystore android/app/mport-release-new.jks \
              -alias "${KEY_ALIAS}" \
              -storepass "${KEYSTORE_PASSWORD}" |
            awk -F': ' '/SHA256:/{print $2; exit}'
          )"

          NORMALIZED_ACTUAL="$(echo "${ACTUAL_SHA256}" | tr '[:lower:]' '[:upper:]')"

          echo "Expected:"
          echo "${EXPECTED_SHA256}"

          echo "Actual:"
          echo "${NORMALIZED_ACTUAL}"

          if [ "${NORMALIZED_ACTUAL}" != "${EXPECTED_SHA256}" ]; then
            echo "::error::Upload keystore fingerprint mismatch."
            exit 1
          fi

          echo "Upload keystore verified successfully."

      # ============================================================
      # CLEANUP DUPLICATE RESOURCES
      # ============================================================
      - name: Remove duplicate launcher resources
        run: |
          set -e

          rm -f android/app/src/main/res/drawable/ic_launcher_foreground.png
          rm -f android/app/src/main/res/drawable/ic_launcher_foreground.xml
          rm -f android/app/src/main/res/drawable/ic_launcher.png
          rm -f android/app/src/main/res/drawable/ic_launcher.xml

      # ============================================================
      # BUILD AAB
      # ============================================================
      - name: Build MPorT GO App Bundle
        run: |
          set -e

          flutter build appbundle \
            --release \
            --obfuscate \
            --split-debug-info=build/debug-info

      # ============================================================
      # VERIFY AAB
      # ============================================================
      - name: Verify AAB
        env:
          EXPECTED_SHA256: "B8:2C:BB:24:66:9B:42:38:BE:72:D7:0C:18:DF:20:E9:72:01:FB:95:27:98:1D:3A:1D:1A:0D:E7:01:AC:39:40"
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail

          AAB="build/app/outputs/bundle/release/app-release.aab"

          if [ ! -f "${AAB}" ]; then
            echo "::error::AAB not found: ${AAB}"
            find build -name "*.aab" -type f || true
            exit 1
          fi

          echo "AAB found:"
          ls -lh "${AAB}"

          echo ""
          echo "=== Verifying AAB signing certificate ==="

          jarsigner -verify -verbose -certs "${AAB}" > /tmp/aab-signature.txt 2>&1

          cat /tmp/aab-signature.txt | grep -E \
            "jar verified|X.509|SHA256|CN=" || true

          echo ""
          echo "=== Extracting certificate fingerprint ==="

          AAB_SHA256="$(
            keytool -printcert \
              -jarfile "${AAB}" |
            awk -F': ' '/SHA256:/{print $2; exit}'
          )"

          AAB_SHA256="$(echo "${AAB_SHA256}" | tr '[:lower:]' '[:upper:]')"

          echo "Expected:"
          echo "${EXPECTED_SHA256}"

          echo "AAB:"
          echo "${AAB_SHA256}"

          if [ -z "${AAB_SHA256}" ]; then
            echo "::error::Could not extract AAB certificate SHA-256."
            exit 1
          fi

          if [ "${AAB_SHA256}" != "${EXPECTED_SHA256}" ]; then
            echo "::error::AAB is not signed with the expected upload key."
            exit 1
          fi

          echo "AAB signature verified successfully."

      # ============================================================
      # PREPARE PLAY STORE ARTIFACT
      # ============================================================
      - name: Prepare Google Play artifact
        run: |
          set -e

          mkdir -p artifacts

          cp \
            build/app/outputs/bundle/release/app-release.aab \
            artifacts/MPorT-GO-release.aab

          echo "=== Google Play artifact ==="
          ls -lh artifacts/MPorT-GO-release.aab

      # ============================================================
      # UPLOAD AAB
      # ============================================================
      - name: Upload MPorT GO AAB
        uses: actions/upload-artifact@v4
        with:
          name: MPorT-GO-release-aab
          path: artifacts/MPorT-GO-release.aab
          if-no-files-found: error

      # ============================================================
      # CLEANUP
      # ============================================================
      - name: Remove signing files
        if: always()
        run: |
          rm -f android/app/mport-release-new.jks
          rm -f android/key.properties

          echo "Temporary signing files removed."
