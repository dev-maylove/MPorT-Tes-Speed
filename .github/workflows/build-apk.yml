name: MPorT Go - Quality & Signed APK + AAB

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mport-build-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '17'
  # GitHub runners can occasionally emit `Already watching path` when
  # Flutter invokes Gradle twice in the same job. Disable Gradle VFS watching
  # for deterministic CI builds; this does not affect the app at runtime.
  GRADLE_OPTS: '-Dorg.gradle.vfs.watch=false'

jobs:
  quality:
    name: Analyze & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

  release:
    name: Build Signed Android APK + App Bundle
    runs-on: ubuntu-latest
    needs: quality
    # Never attempt release signing on pull requests, where repository secrets
    # are intentionally unavailable (especially for fork PRs).
    if: github.event_name != 'pull_request'
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Prepare Android NDK for native symbol stripping
        shell: bash
        run: |
          set -euo pipefail
          # GitHub-hosted runners expose the Android SDK, but sdkmanager is
          # not guaranteed to be on PATH. Resolve it explicitly from the
          # installed command-line tools instead of assuming `sdkmanager`
          # is globally available.
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$ANDROID_SDK_ROOT" || { echo '::error::ANDROID_SDK_ROOT/ANDROID_HOME is not set'; exit 1; }

          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' -print -quit 2>/dev/null || true)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo '::error::Android sdkmanager was not found in the installed command-line tools.'
            find "$ANDROID_SDK_ROOT/cmdline-tools" -maxdepth 4 -type f -name sdkmanager -print 2>/dev/null || true
            exit 1
          fi

          SDKMANAGER_DIR="$(dirname "$SDKMANAGER")"
          echo "$SDKMANAGER_DIR" >> "$GITHUB_PATH"
          export PATH="$SDKMANAGER_DIR:$PATH"

          echo "Using sdkmanager: $SDKMANAGER"
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "ndk;28.2.13676358"

          NDK_ROOT="$ANDROID_SDK_ROOT/ndk/28.2.13676358"
          STRIP="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"
          test -x "$STRIP"
          echo "NDK 28.2.13676358 and llvm-strip are available."

      - name: Pub get
        run: flutter pub get

      - name: Validate signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" || { echo '::error::Missing KEYSTORE_BASE64'; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo '::error::Missing KEYSTORE_PASSWORD'; exit 1; }
          test -n "$KEY_ALIAS" || { echo '::error::Missing KEY_ALIAS'; exit 1; }
          test -n "$KEY_PASSWORD" || { echo '::error::Missing KEY_PASSWORD'; exit 1; }
          # Never allow a committed/local key.properties to silently override CI signing.
          test ! -f android/key.properties || { echo '::error::android/key.properties must not exist in CI source'; exit 1; }
          # Never allow a keystore to be supplied by the repository instead of the secret.
          if find . -type f \( -name '*.jks' -o -name '*.keystore' \) -not -path './.git/*' | grep -q .; then
            echo '::error::A signing keystore exists in the repository checkout; remove it and use GitHub Secrets.'
            find . -type f \( -name '*.jks' -o -name '*.keystore' \) -not -path './.git/*' -print
            exit 1
          fi

      - name: Recreate release keystore from GitHub Secret
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p android/app

          # GitHub Secret contains only the Base64 representation of the JKS.
          # It is reconstructed temporarily on the runner and removed in the
          # final cleanup step.
          # Decode strictly and reject malformed/empty secret material.
          CLEAN_B64="$(printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]')"
          printf '%s' "$CLEAN_B64" | base64 --decode > android/app/mport-release.jks
          chmod 600 android/app/mport-release.jks
          test -s android/app/mport-release.jks
          # The keystore must be a readable Java keystore containing the exact alias/password pair.
          keytool -list -keystore android/app/mport-release.jks \
            -alias "$KEY_ALIAS" -storepass "$KEYSTORE_PASSWORD" >/dev/null

          # key.properties is generated only on the runner; it is gitignored.
          printf '%s\n' \
            "storePassword=$KEYSTORE_PASSWORD" \
            "keyPassword=$KEY_PASSWORD" \
            "keyAlias=$KEY_ALIAS" \
            'storeFile=app/mport-release.jks' \
            > android/key.properties
          chmod 600 android/key.properties

          echo 'Release keystore verified.'

          # Capture the expected signing certificate fingerprint without printing
          # any passwords or private key material.
          keytool -list -v -keystore android/app/mport-release.jks \
            -alias "$KEY_ALIAS" -storepass "$KEYSTORE_PASSWORD" \
            > "$RUNNER_TEMP/release-cert.txt"
          CERT_SHA256="$(awk -F': ' '/^[[:space:]]*SHA256:/{print $2; exit}' "$RUNNER_TEMP/release-cert.txt" | tr -d '[:space:]:')"
          test -n "$CERT_SHA256" || { echo '::error::Could not determine release certificate SHA-256 fingerprint'; exit 1; }
          echo "Expected signing certificate SHA-256: $CERT_SHA256"
          echo "CERT_SHA256=$CERT_SHA256" >> "$GITHUB_ENV"

      - name: Prepare Gradle wrapper
        run: |
          set -euo pipefail
          # ZIP extraction / Git on some clients can drop the executable bit.
          # Restore it explicitly so CI is deterministic.
          test -f android/gradlew
          chmod +x android/gradlew
          test -x android/gradlew

      - name: Validate Gradle wrapper
        run: |
          set -euo pipefail
          android/gradlew --version

      - name: Verify Android toolchain for release stripping
        run: |
          set -euo pipefail
          flutter doctor -v
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$ANDROID_SDK_ROOT"
          "$ANDROID_SDK_ROOT/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" --version

      - name: Build signed release APK (universal)
        run: |
          set -euo pipefail
          flutter build apk --release \
            --obfuscate \
            --split-debug-info=build/debug-info \
            --tree-shake-icons

      - name: Build signed Play App Bundle
        run: |
          set -euo pipefail
          flutter build appbundle --release \
            --obfuscate \
            --split-debug-info=build/debug-info \
            --tree-shake-icons

      - name: Locate and verify signed APK + AAB
        run: |
          set -euo pipefail
          APK='build/app/outputs/flutter-apk/app-release.apk'
          AAB='build/app/outputs/bundle/release/app-release.aab'

          test -f "$APK" || { echo '::error::Release APK was not produced'; exit 1; }
          test -f "$AAB" || { echo '::error::Release AAB was not produced'; exit 1; }

          echo 'Inspecting APK signing entries...'
          unzip -Z1 "$APK" | grep -Fx 'META-INF/MANIFEST.MF' >/dev/null || {
            echo '::error::Release APK has no META-INF/MANIFEST.MF. v1 signing is required for this minSdk/verification path.'
            exit 1
          }

          echo 'Verifying APK signature with Android SDK apksigner...'
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER" || { echo '::error::apksigner was not found'; exit 1; }
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/apksigner.txt"
          grep -Fq 'Verifies' "$RUNNER_TEMP/apksigner.txt" || {
            echo '::error::apksigner did not verify the release APK.'
            exit 1
          }
          grep -Fq 'Verified using v1 scheme (JAR signing): true' "$RUNNER_TEMP/apksigner.txt" || {
            echo '::error::APK is not v1/JAR signed. Enable V1 signing in the release signingConfig.'
            exit 1
          }
          grep -Fq 'Verified using v2 scheme (APK Signature Scheme v2): true' "$RUNNER_TEMP/apksigner.txt" || {
            echo '::error::APK is not v2 signed. Enable V2 signing in the release signingConfig.'
            exit 1
          }
          tr -d '[:space:]:' < "$RUNNER_TEMP/apksigner.txt" | grep -Fq "$CERT_SHA256" || {
            echo '::error::APK certificate does not match the CI release keystore certificate.'
            exit 1
          }
          echo 'APK signature and certificate fingerprint verified.'

          echo 'Verifying AAB signature with jarsigner...'
          jarsigner -verify -verbose:certs "$AAB" >"$RUNNER_TEMP/jarsigner-aab.txt"
          tr -d '[:space:]:' < "$RUNNER_TEMP/jarsigner-aab.txt" | grep -Fq "$CERT_SHA256" || {
            echo '::error::AAB signer certificate does not match the CI release keystore certificate.'
            exit 1
          }
          echo 'AAB signature and certificate fingerprint verified.'

          # Release artifacts must not be debug-signed. The APK must also be
          # structurally valid and have exactly one Android signing certificate.
          SIGNER_COUNT="$($APKSIGNER verify --print-certs "$APK" 2>/dev/null | grep -c '^Signer #' || true)"
          test "$SIGNER_COUNT" -eq 1 || { echo "::error::Expected exactly one APK signer, found $SIGNER_COUNT"; exit 1; }

          echo 'Release artifacts:'
          ls -lh "$APK" "$AAB"
          sha256sum "$APK" "$AAB"

      - name: Prepare release artifacts
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp build/app/outputs/flutter-apk/app-release.apk artifacts/MPorT-Tes-Speed-release.apk
          cp build/app/outputs/bundle/release/app-release.aab artifacts/MPorT-Tes-Speed-release.aab

          if [ -d build/debug-info ]; then
            tar -C build -czf artifacts/MPorT-Tes-Speed-debug-info.tar.gz debug-info
          fi

          sha256sum artifacts/*.apk artifacts/*.aab > artifacts/SHA256SUMS.txt

      - name: Upload signed APK + AAB
        uses: actions/upload-artifact@v7
        with:
          name: MPorT-Tes-Speed-Android-Release
          path: artifacts/
          if-no-files-found: error
          retention-days: 14

      - name: Remove signing material
        if: always()
        run: |
          rm -f android/app/mport-release.jks android/key.properties
          rm -f "$RUNNER_TEMP/release-cert.txt" "$RUNNER_TEMP/apksigner.txt" "$RUNNER_TEMP/jarsigner-aab.txt"
          # Fail cleanup if signing material still exists.
          test ! -e android/app/mport-release.jks
          test ! -e android/key.properties
          echo 'Temporary signing material removed.'
