name: Build MPorT Tes Speed APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Flutter Analyze · Test · Signed Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      # ============================================================
      # RELEASE SIGNING
      # ============================================================
      - name: Setup new release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail

          echo "=== Checking signing secrets ==="

          if [ -z "${KEYSTORE_BASE64}" ]; then
            echo "::error::KEYSTORE_BASE64 is missing"
            exit 1
          fi

          if [ -z "${KEYSTORE_PASSWORD}" ]; then
            echo "::error::KEYSTORE_PASSWORD is missing"
            exit 1
          fi

          if [ -z "${KEY_PASSWORD}" ]; then
            echo "::error::KEY_PASSWORD is missing"
            exit 1
          fi

          if [ -z "${KEY_ALIAS}" ]; then
            echo "::error::KEY_ALIAS is missing"
            exit 1
          fi

          echo "Signing secrets are present."

          # Create keystore directory
          mkdir -p android/app

          # Decode the NEW keystore
          printf '%s' "${KEYSTORE_BASE64}" \
            | base64 --decode \
            > android/app/mport-release-new.jks

          # Verify keystore file exists
          if [ ! -s android/app/mport-release-new.jks ]; then
            echo "::error::Decoded keystore is empty or missing"
            exit 1
          fi

          chmod 600 android/app/mport-release-new.jks

          echo "Keystore created successfully."

          # Create key.properties for Gradle
          cat > android/key.properties <<EOF
          storePassword=${KEYSTORE_PASSWORD}
          keyPassword=${KEY_PASSWORD}
          keyAlias=${KEY_ALIAS}
          storeFile=app/mport-release-new.jks
          EOF

          chmod 600 android/key.properties

          echo "key.properties created."

          # Verify alias and keystore integrity
          keytool -list \
            -keystore android/app/mport-release-new.jks \
            -alias "${KEY_ALIAS}" \
            -storepass "${KEYSTORE_PASSWORD}" \
            > /tmp/keystore-check.txt

          echo "Keystore alias verification passed."

          # Expected certificate SHA-256 of the NEW keystore
          EXPECTED_SHA256="B8:2C:BB:24:66:9B:42:38:BE:72:D7:0C:18:DF:20:E9:72:01:FB:95:27:98:1D:3A:1D:1A:0D:E7:01:AC:39:40"

          ACTUAL_SHA256="$(
            keytool -list -v \
              -keystore android/app/mport-release-new.jks \
              -alias "${KEY_ALIAS}" \
              -storepass "${KEYSTORE_PASSWORD}" |
            awk -F': ' '/SHA256:/{print $2; exit}'
          )"

          echo "Expected certificate SHA-256:"
          echo "${EXPECTED_SHA256}"

          echo "Actual certificate SHA-256:"
          echo "${ACTUAL_SHA256}"

          if [ "${ACTUAL_SHA256}" != "${EXPECTED_SHA256}" ]; then
            echo "::error::Keystore certificate SHA-256 does not match the expected NEW keystore."
            exit 1
          fi

          echo "NEW keystore fingerprint verified successfully."

      # ============================================================
      # RESOURCE CLEANUP
      # ============================================================
      - name: Remove duplicate launcher resources
        run: |
          set -e

          rm -f android/app/src/main/res/drawable/ic_launcher_foreground.png
          rm -f android/app/src/main/res/drawable/ic_launcher_foreground.xml
          rm -f android/app/src/main/res/drawable/ic_launcher.png
          rm -f android/app/src/main/res/drawable/ic_launcher.xml

          echo "drawable after cleanup:"
          ls -la android/app/src/main/res/drawable/ || true

          echo "mipmap foreground:"
          ls android/app/src/main/res/mipmap-*/ic_launcher_foreground.png || true

      # ============================================================
      # BUILD
      # ============================================================
      - name: Build APK (signed release, split per ABI)
        run: |
          set -e

          flutter build apk \
            --release \
            --split-per-abi \
            --obfuscate \
            --split-debug-info=build/debug-info

      # ============================================================
      # VERIFY APK SIGNATURE
      # ============================================================
      - name: Verify APK signatures
        env:
          EXPECTED_SHA256: "B8:2C:BB:24:66:9B:42:38:BE:72:D7:0C:18:DF:20:E9:72:01:FB:95:27:98:1D:3A:1D:1A:0D:E7:01:AC:39:40"
        run: |
          set -euo pipefail

          APKSIGNER="${ANDROID_HOME}/build-tools/$(ls "${ANDROID_HOME}/build-tools" | sort -V | tail -1)/apksigner"

          if [ ! -x "${APKSIGNER}" ]; then
            echo "::error::apksigner not found"
            exit 1
          fi

          echo "Using apksigner:"
          echo "${APKSIGNER}"

          mkdir -p verified-apks

          found=0

          for apk in build/app/outputs/flutter-apk/*.apk; do
            if [ ! -f "$apk" ]; then
              continue
            fi

            found=1

            echo ""
            echo "================================================"
            echo "VERIFYING: $apk"
            echo "================================================"

            "${APKSIGNER}" verify --verbose --print-certs "$apk"

            CERT_SHA256="$(
              "${APKSIGNER}" verify --print-certs "$apk" 2>&1 |
              awk -F': ' '/certificate SHA-256 digest:/{print $2; exit}'
            )"

            echo "APK certificate SHA-256:"
            echo "${CERT_SHA256}"

            if [ "${CERT_SHA256}" != "${EXPECTED_SHA256}" ]; then
              echo "::error::APK is NOT signed with the NEW keystore."
              echo "::error::Expected: ${EXPECTED_SHA256}"
              echo "::error::Actual:   ${CERT_SHA256}"
              exit 1
            fi

            echo "✓ APK signature matches NEW keystore."

            cp "$apk" "verified-apks/$(basename "$apk")"
          done

          if [ "$found" -eq 0 ]; then
            echo "::error::No APK files found"
            exit 1
          fi

          echo ""
          echo "=========================================="
          echo "ALL APK SIGNATURES VERIFIED"
          echo "=========================================="

          ls -lh verified-apks/

      # ============================================================
      # ARTIFACTS
      # ============================================================
      - name: Upload signed APKs
        uses: actions/upload-artifact@v4
        with:
          name: MPorT-Tes-Speed-signed-release
          path: verified-apks/
          if-no-files-found: error

      # ============================================================
      # CLEANUP SECRETS FROM RUNNER
      # ============================================================
      - name: Remove signing files
        if: always()
        run: |
          rm -f android/app/mport-release-new.jks
          rm -f android/key.properties
          echo "Temporary signing files removed."
